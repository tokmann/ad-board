services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: adboard_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  tomcat:
    image: tomcat:10.1-jdk17
    ports:
      - "8080:8080"
    volumes:
      - ./target/adboard-1.0.0.war:/usr/local/tomcat/webapps/adboard.war
    depends_on:
      - postgres
    environment:
      - JDBC_URL=jdbc:postgresql://postgres:5432/adboard_db
      - JDBC_USERNAME=postgres
      - JDBC_PASSWORD=postgres

volumes:
  postgres_data: